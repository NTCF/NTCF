name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Verify formatting
        run: |
          fmt=$(gofmt -s -l .)
          if [ -n "$fmt" ]; then echo "Unformatted files:"; echo "$fmt"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fuzz targets (short)
        run: |
          set -e
          go test ./internal/encoding/ -run=^$ -fuzz=FuzzDecodeInts      -fuzztime=15s
          go test ./internal/encoding/ -run=^$ -fuzz=FuzzRoundTripInts   -fuzztime=15s
          go test ./internal/compress/ -run=^$ -fuzz=FuzzDecompress      -fuzztime=15s
          go test ./internal/column/   -run=^$ -fuzz=FuzzDecodeChunk     -fuzztime=15s
          go test ./internal/index/    -run=^$ -fuzz=FuzzReadColumnIndex -fuzztime=15s
          go test ./internal/query/    -run=^$ -fuzz=FuzzParse           -fuzztime=15s
